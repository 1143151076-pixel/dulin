[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "credit-risk-ml"
version = "0.1.0"
description = "Reproducible credit default classification and validation benchmark"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "joblib", "xlrd", "matplotlib"]
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
credit-risk = "credit_risk.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
